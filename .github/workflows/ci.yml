name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum Go version in go.mod and the latest release.
        go-version: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          # Fetch current security patches instead of using a stale runner toolchain.
          check-latest: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # Keep in sync with the just version in flake.lock.
          just-version: "1.58.0"
      - run: just test
      - run: just race
      - run: just vet
      - run: just tidy-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # new-from-rev in .golangci.yml needs the history.
          fetch-depth: 0
          persist-credentials: false
      # flake.lock pins the linter versions. Do not add a Nix store cache:
      # the upload takes longer than a download from cache.nixos.org.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # The key changes on every commit, so each run saves a fresh cache.
      # golangci-lint and Go check each cache entry against the file contents.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: lint-${{ hashFiles('flake.lock', 'go.mod') }}-${{ github.sha }}
          restore-keys: lint-${{ hashFiles('flake.lock', 'go.mod') }}-
      - run: nix develop -c just lint
      - run: nix develop -c just actionlint
      - run: nix develop -c just zizmor
        env:
          # Enables the online audits, for example known-vulnerable-actions.
          GH_TOKEN: ${{ github.token }}
      - run: nix flake check --no-build --all-systems

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          # govulncheck checks the standard library of the toolchain that runs it.
          go-version: "1.27.x"
          check-latest: true
          # The test job uses the same cache key. A cache key is saved only
          # once, so this job must not save a cache without the race build.
          cache: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # Keep in sync with the just version in flake.lock.
          just-version: "1.58.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: govulncheck-cache
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-v1.3.0-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
      - if: steps.govulncheck-cache.outputs.cache-hit != 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - run: just security
