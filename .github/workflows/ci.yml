name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

# Each job states the permissions that it needs.
permissions: {}

# A new push to a pull request makes the earlier run useless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # GitHub appends the matrix values, for example "Test (1.27.x)". A matrix
    # expression in the name makes the run graph show the job ID instead.
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The minimum Go version in go.mod and the latest release.
        go-version: ["1.26.x", "1.27.x"]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          # Fetch current security patches instead of using a stale runner toolchain.
          check-latest: true
      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # Keep in sync with the just version in flake.lock.
          just-version: "1.58.0"
      - run: just test
      - run: just race
      - run: just bench-smoke
      - run: just vet
      - run: just tidy-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # new-from-rev in .golangci.yml needs the history.
          fetch-depth: 0
          persist-credentials: false
      # flake.lock pins the linter versions. Do not add a Nix store cache:
      # the upload takes longer than a download from cache.nixos.org.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # The key changes on every commit, so each run saves a fresh cache.
      # golangci-lint and Go check each cache entry against the file contents.
      - name: Restore lint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: lint-${{ hashFiles('flake.lock', 'go.mod') }}-${{ github.sha }}
          restore-keys: lint-${{ hashFiles('flake.lock', 'go.mod') }}-
      - run: nix develop -c just lint
      - run: nix develop -c just actionlint
      - run: nix develop -c just zizmor
        env:
          # Enables the online audits, for example known-vulnerable-actions.
          GH_TOKEN: ${{ github.token }}
      - run: nix flake check --no-build --all-systems

  security:
    name: Vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          # govulncheck checks the standard library of the toolchain that runs it.
          go-version: "1.27.x"
          check-latest: true
          # The test job uses the same cache key. A cache key is saved only
          # once, so this job must not save a cache without the race build.
          cache: false
      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # Keep in sync with the just version in flake.lock.
          just-version: "1.58.0"
      - name: Restore govulncheck
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: govulncheck-cache
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-v1.3.0-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
      - name: Install govulncheck
        if: steps.govulncheck-cache.outputs.cache-hit != 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - run: just security

  # The ruleset requires only this job. Thus a change to the jobs or to the
  # Go version matrix does not need a change to the ruleset.
  required:
    name: Required checks
    # A skipped required check counts as a pass. Thus this job must run, and
    # fail, also when a job that it needs fails or is cancelled.
    if: always()
    needs: [test, lint, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if a needed job did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
